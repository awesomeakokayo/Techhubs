name: Phase 3 validation (manual only)

# Automatic runs are intentionally disabled while GitHub Actions billing is
# unavailable. Run the same checks locally; this workflow can be dispatched
# manually once the owner chooses to use GitHub-hosted runners again.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      AUTH_SECRET: phase3-validation-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript tests
        run: npm run test

      - name: Production build
        run: npm run build
